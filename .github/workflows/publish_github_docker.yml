name: Publish Chatwoot docker images to GitHub

permissions:
  contents: read
  packages: write

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # ghcr.io recusa maiuscula no nome do repositorio ("repository name must be lowercase"),
          # e o dono deste fork tem maiuscula. As expressoes do Actions nao tem funcao de caixa
          # baixa, entao a conversao sai daqui e vira variavel de ambiente.
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Update version in app.yml
        run: |
          if [[ "$GIT_REF" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Updating version to: $VERSION"
            sed -i "s/version: '.*'/version: '$VERSION'/" config/app.yml
          else
            echo "No version tag found, keeping existing version"
          fi

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          echo "SANITIZED_REF=${SANITIZED_REF}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.SANITIZED_REF }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare
        run: |
          echo "SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${IMAGE_REPO}:${SANITIZED_REF} \
            -t ${IMAGE_REPO}:latest \
            $(printf "${IMAGE_REPO}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${IMAGE_REPO}:${SANITIZED_REF}
          docker buildx imagetools inspect ${IMAGE_REPO}:latest
